version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "02:10"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "02:20"
      timezone: Europe/London
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "appetyte-ltd/engineering-workflows/*"
    groups:
      github-actions:
        patterns:
          - "*"
